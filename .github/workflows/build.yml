name: Build firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.docx'
      - '*.zip'
      - 'proteus/**'
  pull_request:
    paths-ignore:
      - '*.docx'
      - '*.zip'
      - 'proteus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: stm32f1c8-release
            dir: release
          - preset: stm32f1c8-debug
            dir: debug
          - preset: stm32f1c8-release-proteus
            dir: proteus-release

    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make cmake gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi

      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build the firmware
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Summarize
        shell: bash
        working-directory: artifacts/stm32f1c8/${{ matrix.dir }}
        run: |
          {
            echo "### Preset: ${{ matrix.preset }}"
            echo '```'
            arm-none-eabi-gcc --version | head -1
            arm-none-eabi-size ricecooker.elf
            sha256sum ricecooker.bin ricecooker.hex
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ricecooker-${{ matrix.dir }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/stm32f1c8/${{ matrix.dir }}/ricecooker.elf
            artifacts/stm32f1c8/${{ matrix.dir }}/ricecooker.stripped.elf
            artifacts/stm32f1c8/${{ matrix.dir }}/ricecooker.hex
            artifacts/stm32f1c8/${{ matrix.dir }}/ricecooker.bin
            artifacts/stm32f1c8/${{ matrix.dir }}/ricecooker.map

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: flower-saint-release
      TITLE: Ricecooker Firmware

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ricecooker-*-${{ github.sha }}
          path: downloaded

      - name: Prepare assets
        shell: bash
        run: |
          mkdir dist
          for preset in release debug proteus-release; do
            for file in downloaded/ricecooker-"$preset"-"$GITHUB_SHA"/*; do
              name=$(basename "$file")
              cp "$file" "dist/${name/ricecooker/ricecooker-$preset}"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          {
            echo "Built from $GITHUB_SHA"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

      - name: Publish
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA"
          fi

